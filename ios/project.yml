name: VoiceOrbPlayground
options:
  bundleIdPrefix: com.quippyapp.prototype
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VoiceOrbPlayground:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shaders
      - path: Licenses
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quippyapp.prototype.voiceorb
        PRODUCT_NAME: VoiceOrbPlayground
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Voice Orb
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The voice orb prototype uses the microphone only to visualise how loud you are speaking. No audio is recorded, stored, or sent anywhere."
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        MTL_FAST_MATH: YES
        SWIFT_OBJC_BRIDGING_HEADER: Shaders/OrbShaderTypes.h
  VoiceOrbPlaygroundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VoiceOrbPlayground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quippyapp.prototype.voiceorb.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  VoiceOrbPlayground:
    build:
      targets:
        VoiceOrbPlayground: all
        VoiceOrbPlaygroundTests: [test]
    test:
      targets:
        - VoiceOrbPlaygroundTests
    run:
      config: Debug
